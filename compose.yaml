name: src

# The stack, optional: an always-on member of The Source's swarm, for a
# public server, where browsers anywhere can reach its seeder. The site
# needs none of it: builds hash the stations themselves, and listeners, the
# public trackers and the mirror carry the radio. To use it from the site,
# set SRC_SEED_URL and SRC_TRACKER_URL (.env.example).
#
#   tracker   introduces peers to each other, and carries their WebRTC
#             handshakes (WebSocket, port 8002). Optional: public trackers
#             do the same job; this one is redundancy you control
#   seeder    seeds every station as a torrent, and relays chat
#   library   peers that remember the prose and code of git repositories
#             (PEER_SOURCES), and answer the ghost text's memory questions
#             in the chats; public profile
#   webseed   serves the station folders (or what the seeder fetched) over
#             HTTP (port 8001), so a browser that cannot reach any peer
#             still plays the radio
#   tunnel    optional: publishes the tracker and the web seed through a
#             Cloudflare Tunnel (docker compose --profile tunnel up -d)

x-app: &app
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# One image runs tracker.js, seed.js and webseed.js. It runs as your user,
# so it can read station folders that only you can read.
x-node: &node
  image: src-node:4
  build:
    context: .
    dockerfile: containers/node/Dockerfile
  user: "${PUID:-1000}:${PGID:-1000}"

services:
  tracker:
    <<: [*app, *node]
    command: [node, tracker.js]
    environment:
      PORT: "8002"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${TRACKER_PORT:-8002}:8002"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8002/stats.json').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # The seeder is on the host's network, not Docker's, so WebRTC peers reach
  # it at this machine's own addresses with no Docker NAT in the way: on a
  # public server, from behind any NAT, with no TURN relay; at home, from
  # the same LAN (Docker's network offered only its 172.x addresses). Open
  # WEBRTC_PORTS (UDP) in the firewall of a public server, and in the cloud
  # provider's. Host networking needs Linux, or a recent Docker Desktop with
  # it turned on.
  seeder:
    <<: [*app, *node]
    command: [node, seed.js]
    network_mode: host
    depends_on:
      tracker:
        condition: service_healthy
    environment:
      # Announced to, but never written into a .torrent file: the stack's
      # tracker, as published on the host.
      TRACKERS: ws://${BIND_ADDRESS:-127.0.0.1}:${TRACKER_PORT:-8002}
      # Written into every .torrent file.
      ANNOUNCE: ${PUBLIC_TRACKERS:-wss://tracker.openwebtorrent.com,wss://open.ftorrent.com,wss://tracker.novage.com.ua,wss://tracker.webtorrent.dev}
      CHATS: ${CHATS:-trade}
      # WebRTC's UDP ports, and an upload cap in KiB/s (seed.js).
      WEBRTC_PORTS: ${WEBRTC_PORTS:-51000-51999}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT:-0}
      # A station with no folder here is fetched: its .torrent from the
      # site, its songs from the swarm and the mirror, into the stations
      # volume; the site is asked for a new version every STATION_REFRESH
      # hours (seed.js).
      SITE_URL: ${SITE_URL:-https://src.eco}
      MIRROR_URL: ${MIRROR_URL:-https://radio.src.eco}
      STATION_REFRESH: ${STATION_REFRESH:-6}
    volumes:
      # One line per station: a folder, mounted at /radio/<frequency>.
      # Unset, it is empty, and the station is fetched into /cache.
      - ${STATION_59_1:-./data/radio/59.1}:/radio/59.1:ro
      - torrents:/torrents
      - stations:/cache
    healthcheck:
      test: [CMD, node, -e, "process.exit(Date.now() - Number(require('fs').readFileSync('/tmp/alive', 'utf8')) < 90000 ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

  webseed:
    <<: [*app, *node]
    command: [node, webseed.js]
    environment:
      PORT: "8001"
    volumes:
      - ${STATION_59_1:-./data/radio/59.1}:/radio/59.1:ro
      - torrents:/torrents:ro
      - stations:/cache:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEBSEED_PORT:-8001}:8001"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Test peers for the ghost text's swarm memory: they hold a biased library
  # (children's stories, or Don Quijote) and answer what browsers in their
  # room ask while typing. Not part of the stack proper:
  #   docker compose --profile test up -d --build peers
  # then open the site at ?chat=memorytest.
  peers:
    <<: [*app, *node]
    profiles: [test]
    command: [node, peers.js]
    depends_on:
      tracker:
        condition: service_healthy
    environment:
      TRACKERS: ws://tracker:8002,${PUBLIC_TRACKERS:-wss://tracker.openwebtorrent.com,wss://open.ftorrent.com,wss://tracker.novage.com.ua,wss://tracker.webtorrent.dev}
      PEERS: ${PEERS:-8}
      PEER_DATA: ${PEER_DATA:-tinystories}
      PEER_CHATS: ${PEER_CHATS:-memorytest}
      PEER_DROP: ${PEER_DROP:-0}
      PEER_DELAY: ${PEER_DELAY:-0}
      DATA_DIR: /data
    volumes:
      - peers:/data

  # The library: peers that remember the prose and code of the git
  # repositories in PEER_SOURCES (cloned into the `library` volume, read
  # again every PEER_REFRESH hours) and answer the ghost text's memory
  # questions in the chats the seeder relays (CHATS), each answer counting
  # PEER_WEIGHT (0 to 1; a person's own counts 1). Like the seeder, it is on
  # the host's network so browsers anywhere reach it, with its own UDP range
  # (PEER_WEBRTC_PORTS) to open in the firewalls. With no sources it idles.
  library:
    <<: [*app, *node]
    profiles: [public]
    command: [node, peers.js]
    network_mode: host
    depends_on:
      tracker:
        condition: service_healthy
    environment:
      PEER_DATA: git
      PEER_SOURCES: ${PEER_SOURCES:-}
      PEER_CHATS: ${CHATS:-trade}
      PEER_WEIGHT: ${PEER_WEIGHT:-1}
      PEER_REFRESH: ${PEER_REFRESH:-6}
      PEER_MB: ${PEER_MB:-2}
      PEER_PRIVATE: ${PEER_PRIVATE:-1}
      PEER_PRIVATE_GROUPS: ${PEER_PRIVATE_GROUPS:-4}
      PEER_KEY: ${PEER_KEY:-}
      PEERS: ${LIBRARY_PEERS:-0}
      TRACKERS: ws://${BIND_ADDRESS:-127.0.0.1}:${TRACKER_PORT:-8002},${PUBLIC_TRACKERS:-wss://tracker.openwebtorrent.com,wss://open.ftorrent.com,wss://tracker.novage.com.ua,wss://tracker.webtorrent.dev}
      WEBRTC_PORTS: ${PEER_WEBRTC_PORTS:-52000-52999}
      DATA_DIR: /data
    volumes:
      - library:/data
    healthcheck:
      test: [CMD, node, -e, "process.exit(Date.now() - Number(require('fs').readFileSync('/tmp/alive', 'utf8')) < 90000 ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m

  # TLS on a public server: Traefik in front of the tracker and the web seed,
  # with certificates from Let's Encrypt. It uses the TLS-ALPN challenge, so
  # only port 443 has to be reachable; port 80 only redirects to it. Point
  # the DNS of TRACKER_HOST and SEED_HOST at this server, set them in .env,
  # then: docker compose --profile public up -d --build. Routes are in
  # containers/traefik/dynamic.yml.
  traefik:
    <<: *app
    profiles: [public]
    image: docker.io/library/traefik:v3.7.19@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    environment:
      TRACKER_HOST: ${TRACKER_HOST:-}
      SEED_HOST: ${SEED_HOST:-}
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./containers/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - certificates:/certificates
    depends_on:
      tracker:
        condition: service_healthy
      webseed:
        condition: service_healthy

  tunnel:
    <<: *app
    profiles: [tunnel]
    image: docker.io/cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    command: [tunnel, --no-autoupdate, run]
    environment:
      # In the tunnel's settings, route a hostname to http://webseed:8001
      # and, optionally, another to http://tracker:8002.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      tracker:
        condition: service_healthy
      webseed:
        condition: service_healthy

volumes:
  torrents:
  stations:
  peers:
  library:
  certificates:
